<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Contact Me</title>
		<link rel="stylesheet" href="style.css">
		<style>
			body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
			nav { background:#333; padding:10px; }
			nav a { color:#fff; margin-right:15px; text-decoration:none }
			.content{ padding:20px }
			input[type="text"]{ padding:8px; width:200px }
			button{ padding:8px 12px }
		</style>
	</head>
	<body>

		<nav>
			<a href="index.html">Home</a>
			<a href="about.html">About</a>
			<a href="contact.html">Contact</a>
		</nav>

		<div class="content">
			<h1>Contact Me 📬</h1>
			<p>Want to say hi? Here's how!</p>

			<ul>
				<li>📧 Email: alex@example.com</li>
				<li>📱 Phone: 123-456-7890</li>
				<li>🌍 Location: Earth (probably)</li>
			</ul>

			<h2>Send Me a Quick Message</h2>
			<input type="text" id="userName" placeholder="Your name">
			<button onclick="greet()">Send</button>

			<p id="reply"></p>

			<script>
				function greet() {
					let name = document.getElementById("userName").value;
					if(!name) name = 'there';
					document.getElementById("reply").innerText = "Hi " + name + "! Thanks for your message! 💌";
				}
			</script>
		</div>

	</body>
</html>
